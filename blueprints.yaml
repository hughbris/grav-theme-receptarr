name: Receptarr
slug: receptarr
type: theme
version: 2.3.0
description: "Receptarr is an update of the Receptar theme by Team Grav (https://github.com/getgrav/grav-theme-receptar). It is described as a simple, modern, responsive, high-DPI, fully customizable, stylish blog Grav theme. It features split-screen book-like design inspired by a modern cook book with emphasize on beautiful imagery and typography."
icon: group
author:
  name: Hugh Barnes
  email: dev@hubns.com
homepage: https://github.com/hughbris/grav-theme-receptarr
demo: http://demo.getgrav.org/receptar-skeleton
keywords: receptar, theme, cookbook, split-screen, fast, responsive, html5, css3
bugs: https://github.com/hughbris/grav-theme-receptarr/issues
license: GPL2

dependencies:
  - { name: grav, version: '>=1.7.0' }

form:
  validation: loose
  fields:
    showchildpages.enabled:
        type: toggle
        label: ADMIN.NAVBAR.CHILD_PAGES
        highlight: 1
        default: 1
        options:
          1: PLUGIN_ADMIN.ENABLED
          0: PLUGIN_ADMIN.DISABLED
        validate:
          type: bool

    images:
      type: section
      title: ADMIN.SPECIAL_IMAGES
      fields:

        favicon_cols:
          type: columns
          fields:
            favicon_field:
              type: column
              fields:
                favicon_image:
                  type: file
                  destination: 'user://images'
                  label: ADMIN.FAVICON.LABEL
                  help: ADMIN.FAVICON.HELP
                  multiple: false
                  accept:
                    - .png
                    - .jpg
                    - .ico

            favicon_default:
              type: column
              fields:
                favicon_image_preview:
                  type: display
                  label: false
                  content: ADMIN.FAVICON.DEFAULT_MESSAGE
                  markdown: true

        fallback_cols:
          type: columns
          fields:
            fallback_field:
              type: column
              fields:
                fallback_image:
                  type: file
                  destination: 'user://images'
                  label: ADMIN.FEATURES.FALLBACK.LABEL
                  help: ADMIN.FEATURES.FALLBACK.HELP
                  multiple: false
                  accept:
                    # - .webm ??
                    - .png
                    - .jpg

            fallback_default:
              type: column
              fields:
                fallback_image_preview:
                  type: display
                  label: false
                  content: ADMIN.FEATURES.IMAGE.DEFAULT_MESSAGE
                  markdown: true

    styles_section:
      type: section
      title: ADMIN.STYLES.LABEL
      fields:
        styles_cols:
          type: columns
          fields:

            styles_col1:
              type: column
              fields:
                styles.site.accent.color:
                  type: colorpicker
                  label: ADMIN.STYLES.ACCENT_COLOR
                styles.site.contrast.color:
                  type: colorpicker
                  label: ADMIN.STYLES.CONTRAST_TEXT
                styles.site.border.color:
                  type: colorpicker
                  label: ADMIN.STYLES.BORDER_COLOR
                styles.site.interactive.shade:
                  type: range
                  label: ADMIN.STYLES.INTERACTIVE_SHADE
                  validate:
                    min: 0
                    max: 1
                    step: 0.1
                styles.header.shade:
                  type: range
                  label: ADMIN.STYLES.HEADER_SHADE
                  validate:
                    min: 0
                    max: 1
                    step: 0.1
                styles.flyout.foreground.color:
                  type: colorpicker
                  label: ADMIN.STYLES.FLYOUT_TEXT
                styles.flyout.background.color:
                  type: colorpicker
                  label: ADMIN.STYLES.FLYOUT_BACKGROUND
                styles.flyout.border.color:
                  type: colorpicker
                  label: ADMIN.STYLES.FLYOUT_BORDER
                styles.menu.highlight.background.color:
                  type: colorpicker
                  label: ADMIN.STYLES.MENU_HIGHLIGHT_BACKGROUND

            styles_col2:
              type: column
              fields:
                styles.content.foreground.color:
                  type: colorpicker
                  label: ADMIN.STYLES.CONTENT_TEXT
                styles.content.background.color:
                  type: colorpicker
                  label: ADMIN.STYLES.CONTENT_BACKGROUND
                styles.headings.foreground.color:
                  type: colorpicker
                  label: ADMIN.STYLES.HEADINGS_TEXT
                styles.posts.background.color:
                  type: colorpicker
                  label: ADMIN.STYLES.POSTS_BACKGROUND
                styles.post.meta.background.color:
                  type: colorpicker
                  label: ADMIN.STYLES.POST_META_BACKGROUND
                styles.gallery.captions.foreground.color:
                  type: colorpicker
                  label: ADMIN.STYLES.GALLERY_CAPTIONS_TEXT
                styles.gallery.captions.shade:
                  type: range
                  label: ADMIN.STYLES.GALLERY_CAPTIONS_SHADE
                  validate:
                    min: 0
                    max: 1
                    step: 0.1
                styles.footer.foreground.color:
                  type: colorpicker
                  label: ADMIN.STYLES.FOOTER_TEXT
                styles.footer.background.color:
                  type: colorpicker
                  label: ADMIN.STYLES.FOOTER_BACKGROUND
